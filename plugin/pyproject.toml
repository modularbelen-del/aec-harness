[project]
name = "aec"
version = "0.1.0"
description = "Ofis AEC harness çekirdeği: geometri, DWG okuma, Revit doğrulama"
requires-python = ">=3.12,<3.13"
dependencies = ["shapely>=2.1,<3", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aec"]
